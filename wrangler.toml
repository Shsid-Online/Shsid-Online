name = "shsid-online-api"
main = "worker/index.js"
compatibility_date = "2026-05-08"

routes = [
  { pattern = "www.shsid.online/api/*", zone_name = "shsid.online" },
  { pattern = "shsid.online/api/*", zone_name = "shsid.online" },
  { pattern = "www.shsid.online/auth/facebook/*", zone_name = "shsid.online" },
  { pattern = "shsid.online/auth/facebook/*", zone_name = "shsid.online" },
  { pattern = "www.shsid.online/upload-url", zone_name = "shsid.online" },
  { pattern = "shsid.online/upload-url", zone_name = "shsid.online" },
  { pattern = "www.shsid.online/upload/*", zone_name = "shsid.online" },
  { pattern = "shsid.online/upload/*", zone_name = "shsid.online" },
  { pattern = "www.shsid.online/health", zone_name = "shsid.online" },
  { pattern = "shsid.online/health", zone_name = "shsid.online" }
]

[vars]
INSTAGRAM_USER_ID = "17841475807417225"

[[ratelimits]]
name = "API_RATE_LIMIT"
namespace_id = "10101"
simple = { limit = 240, period = 60 }

[[ratelimits]]
name = "WRITE_RATE_LIMIT"
namespace_id = "10102"
simple = { limit = 40, period = 60 }

[[ratelimits]]
name = "POST_RATE_LIMIT"
namespace_id = "10103"
simple = { limit = 6, period = 60 }

[[ratelimits]]
name = "DUPLICATE_RATE_LIMIT"
namespace_id = "10104"
simple = { limit = 1, period = 60 }

[observability]
enabled = true

[triggers]
crons = ["* * * * *"]

[[d1_databases]]
binding = "DB"
database_name = "shsid-social-db"
database_id = "3a073c1d-b38c-49e7-9282-d193c1bb4248"

[[kv_namespaces]]
binding = "SESSIONS"
id = "8313bb172fc349dbba8e957975b29aaf"
preview_id = "8313bb172fc349dbba8e957975b29aaf"

[[r2_buckets]]
binding = "R2_BUCKET"
bucket_name = "shsid-media"
